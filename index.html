/* =====================================================
   DAILY REWARD
===================================================== */

function sameDay(a,b){

 const x=new Date(a);
 const y=new Date(b);

 return(
  x.getFullYear()===y.getFullYear() &&
  x.getMonth()===y.getMonth() &&
  x.getDate()===y.getDate()
 );

}


function yesterday(a,b){

 const x=new Date(a);
 const y=new Date(b);

 x.setHours(0,0,0,0);
 y.setHours(0,0,0,0);

 return y-x===86400000;

}


function dailyRewardHTML(){

 if(sameDay(
  game.lastDailyClaim,
  Date.now()
 )){

  return `

  `;

 }


 const rewards=[

  50000,
  100000,
  250000
 ];

 let day=
 (game.dailyStreak%7)+1;

 return `

 <div class="notice">

  🎁 Hari ke-${day}

  <br>

  <b>
   🪙 ${money(rewards[day-1])}

function claimDaily(){

 if(sameDay(
  game.lastDailyClaim,
  Date.now()
 )){

  alert("Reward sudah diambil.");

  return;

 }


 if(
  game.lastDailyClaim &&
  !yesterday(
   game.lastDailyClaim,
   Date.now()
  )
 ){

  game.dailyStreak=0;

 }


 const rewards=[
  5000,
  10000,
  15000,
  25000,
  50000,
  100000,
  250000
 ];

 const day=
 (game.dailyStreak%7)+1;

 const reward=
 rewards[day-1];

 game.coins+=reward;

 game.stats.totalEarned+=reward;

 game.stats.dailyClaims++;

 game.dailyStreak++;

 game.lastDailyClaim=Date.now();

 gainXP(150);

 alert(

function startRandomAuction(){

 items.filter(
  x=>x[2]<=2000000
 );

 pool[

   Math.random()*pool.length
  )
 ];

}


function startSpecialAuction(){

 const pool=
 items.filter(
  x=>x[3]==="Mythic"
 );

 const item=
 pool[
  Math.floor(
   Math.random()*pool.length
  )
 ];

 startAuction(item,true);

}


function startAuction(item,special){

 if(auction){

  alert(
   "Auction sedang berlangsung."
  );

  return;

 }


 const count=
 special?3:
 Math.random()<.5?2:3;

 const shuffled=
 [...botData]
 .sort(
  ()=>Math.random()-.5
 );

 const bots=
 shuffled
 .slice(0,count)
 .map(bot=>({
  ...bot,
  current:0
 }));


 auction={

  item:item,

  special:special,

  timer:special?60:45,

  currentBid:
   Number(item[2]),

  leader:"Kamu",

  leaderType:"player",

  bots:bots,

  log:[]

 };


 addLog(
  "🔨 Auction dimulai!"
 );

 renderAuction();


 clearInterval(
  auctionTimer
 );

 auctionTimer=
 setInterval(
  gameTick,
  1000
 );

}


/* =====================================================
   AUCTION LOG
===================================================== */

function addLog(text){

 if(!auction)
  return;

 auction.log.unshift(text);

 auction.log=
 auction.log.slice(0,30);

}


/* =====================================================
   AUCTION TICK
===================================================== */

function gameTick(){

 if(!auction)
  return;

 auction.timer--;

 if(Math.random()<.65)
  botTryBid();

 renderAuction();

 if(auction.timer<=0)
  finishAuction();

}


function nextBid(){

 return Math.max(

  auction.currentBid+500,

  Math.ceil(
   auction.currentBid*1.10/500
  )*500

 );

}


/* =====================================================
   BOT BID
===================================================== */

function botTryBid(){

 if(!auction)
  return;

 const possible=
 auction.bots.filter(bot=>{

  const bid=
   nextBid();

  const max=
   bot.money*
   (.45+
   bot.aggression*.45);

  return bid<=max;

 });


 if(!possible.length)
  return;


 const bot=
 possible[
  Math.floor(
   Math.random()*possible.length
  )
 ];


 const bid=
 nextBid();


 if(Math.random()<bot.aggression){

  auction.currentBid=bid;

  auction.leader=
   bot.name;

  auction.leaderType=
   "bot";

  bot.current=
   bid;

  addLog(
   bot.icon+
   " "+
   bot.name+
   " bid 🪙 "+
   money(bid)
  );

 }

}


/* =====================================================
   PLAYER BID
===================================================== */

function userBid(){

 nextBid();

 if(game.coins<bid){

 addLog(

  money(bid)
 );

 renderAuction();


 setTimeout(()=>{

  if(auction)
   botTryBid();

 },500);

}

/* =====================================================
   FINISH AUCTION
===================================================== */

function finishAuction(){

 if(!auction)
  return;

 clearInterval(
  auctionTimer
 );

 const a=
  auction;

 auction=null;


 if(a.leaderType==="player"){

  if(game.coins<a.currentBid){

   game.stats.auctionLosses++;

   alert(
    "❌ Coins tidak cukup."
   );

  }else{

   game.coins-=
    a.currentBid;

   game.stats.totalSpent+=
    a.currentBid;

   game.stats.auctionWins++;


   game.owned.push([

    a.item[0],
    a.item[1],
    a.item[2],
    a.item[3],
    a.currentBid

   ]);


   gainXP(
    Math.max(
     100,
     Math.floor(
      a.currentBid/1000
     )
    )
   );


   save();

   updateCoins();


   alert(

    "🏆 MENANG AUCTION!\n\n"+
    a.item[1]+
    " "+
    a.item[0]+
    "\n\n"+
    "Bayar: 🪙 "+
    money(a.currentBid)+
    "\n\n"+
    "Item masuk Gudang."

   );

  }

 }else{

  game.stats.auctionLosses++;

  save();

  alert(

   "😢 KALAH AUCTION\n\n"+
   a.item[1]+
   " "+
   a.item[0]+
   "\n\n"+
   "Pemenang: "+
   a.leader

  );

 }


 showPage("auction");

}

/* =====================================================

===================================================== */

function jualItem(index){

 const item=
  game.owned[index];

 if(!item)
  return;

 const input=
  document.getElementById(
   "sellPrice"+index
  );

 const price=
  Number(input.value);


 if(!Number.isFinite(price)||price<=0){

  alert(
   "Masukkan harga yang valid."
  );

  return;

 }


 const bot=
 botData[
  Math.floor(
   Math.random()*botData.length
  )
 ];


 const min=
  Number(item[2])*.65;

 const max=
  Number(item[2])*1.55;


 const accepted=
  price>=min &&
  price<=max &&
  Math.random()<
  .8;


 if(!accepted){

  alert(

   "❌ "+
   bot.name+
   " menolak harga itu!\n\n"+
   "Coba turunkan harga."

  );

  return;

 }


 if(!confirm(

  "💵 JUAL ITEM\n\n"+
  item[1]+
  " "+
  item[0]+
  "\n\n"+
  "Pembeli: "+
  bot.name+
  "\n"+
  "Harga: 🪙 "+
  money(price)+
  "\n\n"+
  "Jual?"

 ))return;


 game.owned.splice(
  index,
  1
 );

 game.coins+=price;

 game.stats.totalEarned+=price;

 game.stats.sellFig++;

 gainXP(
  Math.max(
   50,
   Math.floor(price/2000)
  )
 );

 save();

 updateCoins();

 alert(
  "✅ TERJUAL!\n\n"+
  item[0]+
  "\n\n"+
  "+🪙 "+
  money(price)
 );

 warehouse();

}

===================================================== */

function mysteryBox(){

 const price=100000;


 if(game.coins<price){

  alert(
   "❌ Coins tidak cukup.\n\n"+
   "Harga: 🪙 "+
   money(price)
  );

  return;

 }


 if(!confirm(

  "📦 MYSTERY BOX\n\n"+
  "Harga: 🪙 "+
  money(price)+
  "\n\nBuka?"

 ))return;


 game.coins-=price;

 game.stats.totalSpent+=price;

 game.stats.mysteryOpened++;


 const roll=
  Math.random();

 let pool;


 if(roll<.45){

  pool=
   items.filter(
    x=>x[3]==="Rare"
   );

 }else if(roll<.75){

  pool=
   items.filter(
    x=>x[3]==="Epic"
   );

 }else if(roll<.94){

  pool=
   items.filter(
    x=>x[3]==="Legendary"
   );

 }else{

  pool=
   items.filter(
    x=>x[3]==="Mythic"
   );

 }


 const item=
  pool[
   Math.floor(
    Math.random()*pool.length
   )
  ];


 game.owned.push([

  item[0],
  item[1],
  item[2],
  item[3],
  price

 ]);


 gainXP(200);

 save();

 updateCoins();


 alert(

  "📦 MYSTERY BOX!\n\n"+
  item[1]+
  " "+
  item[0]+
  "\n\n"+
  "Rarity: "+
  item[3]+
  "\n"+
  "Nilai: 🪙 "+
  money(item[2])+
  "\n\n"+
  "Masuk Gudang!"

 );


 warehouse();

}


/* =====================================================
   MARKET
===================================================== */

function marketPrice(item){

 const key=
  item[0];


 if(!game.market[key]){

  game.market[key]=
   1+
   (Math.random()*.3-.15);

 }


 game.market[key]+=
  Math.random()*.04-.02;


 game.market[key]=
  Math.max(
   .5,
   Math.min(
    1.8,
    game.market[key]
   )
  );


 return Math.floor(
  item[2]*
  game.market[key]
 );

}

 const sample=
  [...items]
  .sort(
   ()=>Math.random()-.5
  )
  .slice(0,8);


 document.getElementById(
  "page"

   Harga bisa naik atau turun.
  </p>

 </div>


 <div class="grid">

 ${sample.map(item=>{

  const price=
   marketPrice(item);

  const ratio=
   price/item[2];

  const up=
   ratio>=1;

  return `

  <div
   class="item
   rarity-${item[3]}"
  >

   <div class="icon">
    ${item[1]}
   </div>

   <b>
    ${item[0]}
   </b>

   <div class="muted">
    ${item[3]}
   </div>

   </div>

   <div class="${up?
    "market-up":
    "market-down"}">

    ${up?"📈":"📉"}

     (ratio-1)*100
    )}%

   <button
    onclick="
     marketBuy(

function marketBuy(encoded){

 const name=
  decodeURIComponent(encoded);

 const item=
  items.find(
   x=>x[0]===name
  );

 if(!item)
  return;


 const price=
  marketPrice(item);


 if(game.coins<price){

  alert(
   "❌ Coins tidak cukup."
  );

  return;

 }


 if(!confirm(

  "🛒 BELI MARKET?\n\n"+
  item[1]+
  " "+
  item[0]+
  "\n\n"+
  "Harga:\n"+
  "🪙 "+
  money(price)

 ))return;


 game.coins-=price;

 game.stats.totalSpent+=price;

 game.owned.push([

  item[0],
  item[1],
  item[2],
  item[3],
  price

 ]);


 gainXP(100);

 save();

 updateCoins();

 alert(
  "✅ Item masuk Gudang!"
 );

 warehouse();

}

function exportSave(){

 const data=
  JSON.stringify(
   game,
   null,
   2
  );

 const blob=
  new Blob(
   [data],
   {
    type:"application/json"
   }
  );

 const url=
  URL.createObjectURL(blob);

 const a=
  document.createElement("a");

 a.href=url;

 a.download=
  "magic-auction-save.json";

 a.click();

 URL.revokeObjectURL(url);

}


/* =====================================================
   IMPORT SAVE
===================================================== */

document
.getElementById("importFile")
.addEventListener(
 "change",
 function(e){

  const file=
   e.target.files[0];

  if(!file)
   return;


  const reader=
   new FileReader();


  reader.onload=function(){

   try{

    const imported=
     JSON.parse(
      reader.result
     );

    if(
     !imported||
     typeof imported!=="object"
    ){

     throw new Error(
      "File save tidak valid."
     );

    }


    localStorage.setItem(
     "magicAuction2",
     JSON.stringify(imported)
    );


    alert(
     "✅ Save berhasil di-import!"
    );


    location.reload();


   }catch(err){

    alert(
     "❌ Import gagal:\n"+
     err.message
    );

   }

  };


  reader.readAsText(file);

 }
);
